<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حضانه أونلاين</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            font-family: "Segoe UI", "Arial", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 10px;
            overflow-x: hidden;
            position: relative;
        }


        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml, viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            opacity: 0.3;
            z-index: -1;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 1200px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }


        .welcome-title {
            font-size: clamp(2.8rem, 9vw, 4.5rem);
            margin: 10px 0 30px 0;
            text-align: center;
            font-weight: 800;
            letter-spacing: 3px;
            color: white;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            display: inline-block;
        }

        .welcome-title span {
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
            padding: 0 5px;
            position: relative;
        }

        .welcome-title span::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: white;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .welcome-title span:hover::after {
            width: 80%;
        }

        .welcome-title span:hover {
            transform: translateY(-8px);
            color: #FFD700;
        }


        .main-title-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 30px 50px;
            margin: 30px 0 50px 0;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            border: 2px solid rgba(255, 215, 0, 0.3);
            transform: perspective(1000px) rotateX(5deg);
            transition: all 0.5s ease;
        }

        .main-title-card:hover {
            transform: perspective(1000px) rotateX(0deg);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border-color: #FFD700;
        }

        .main-title {
            font-size: clamp(2.5rem, 7vw, 3.8rem);
            color: #4a4a9c;
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .main-title-arabic {
            font-size: clamp(2rem, 6vw, 3rem);
            color: #4a4a9c;
            display: block;
            margin-bottom: 15px;
            font-weight: 700;
            position: relative;
        }

        .main-title-arabic::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 25%;
            width: 50%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #FFD700, transparent);
            border-radius: 2px;
        }

        .main-title-english {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: #667eea;
            display: block;
            font-style: italic;
            font-weight: 600;
        }


        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            width: 100%;
            max-width: 1000px;
            padding: 0 15px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 250px;
            max-width: 320px;
            position: relative;
        }

        .button-wrapper {
            position: relative;
            margin-bottom: 25px;
        }

        .button-image {
            width: 200px;
            height: 200px;
            border-radius: 25px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 5px solid white;
            position: relative;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .button-image::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, #667eea, #764ba2, #FFD700);
            border-radius: 30px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .button-image:hover::before {
            opacity: 1;
        }

        .button-image:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border-color: transparent;
        }

        .button-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 20px;
            transition: transform 0.5s ease;
        }

        .button-image:hover img {
            transform: scale(1.1);
        }

        .button-label {
            font-size: 32px;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 50px;
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            min-width: 180px;
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .button-label::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.7s;
            z-index: -1;
        }

        .button-label:hover::before {
            left: 100%;
        }

        .button-label:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .arabic .button-label {
            background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
        }

        .math .button-label {
            background: linear-gradient(135deg, #4ECDC4, #6EDBD4);
            color: #333;
        }

        .english .button-label {
            background: linear-gradient(135deg, #A78BFA, #C4B5FD);
        }


        .bottom-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-top: auto;
            margin-bottom: 30px;
            width: 100%;
            max-width: 850px;
            padding: 0 15px;
        }

        .action-button {
            font-size: 24px;
            padding: 18px 45px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            min-width: 200px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            z-index: 1;
            color: white;
        }

        .action-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.3) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.6s;
            z-index: -1;
        }

        .action-button:hover::before {
            transform: translateX(100%);
        }

        .action-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .contact {
            background: linear-gradient(135deg, #48BB78, #68D391);
        }

        .map {
            background: linear-gradient(135deg, #ED8936, #F6AD55);
        }


        @media (max-width: 768px) {
            .button-group {
                gap: 25px;
            }

            .button-container {
                min-width: 220px;
            }

            .button-image {
                width: 170px;
                height: 170px;
                border-width: 4px;
            }

            .button-label {
                font-size: 28px;
                padding: 12px 30px;
                min-width: 160px;
            }

            .main-title-card {
                padding: 25px 35px;
                margin: 20px 0 40px 0;
            }

            .action-button {
                font-size: 22px;
                padding: 15px 35px;
                min-width: 180px;
            }
        }

        @media (max-width: 480px) {
            .button-group {
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }

            .button-container {
                width: 100%;
                max-width: 280px;
            }

            .button-image {
                width: 180px;
                height: 180px;
            }

            .button-label {
                font-size: 30px;
                min-width: 180px;
            }

            .bottom-buttons {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .action-button {
                width: 100%;
                max-width: 280px;
                font-size: 22px;
            }

            .main-title-card {
                padding: 20px 25px;
                margin: 15px 0 30px 0;
            }

            .welcome-title {
                font-size: clamp(2.2rem, 8vw, 3.5rem);
            }
        }


        @media (min-width: 1200px) {
            .button-image {
                width: 220px;
                height: 220px;
            }

            .button-label {
                font-size: 36px;
                padding: 18px 45px;
                min-width: 200px;
            }

            .main-title-card {
                padding: 40px 60px;
            }

            .action-button {
                font-size: 26px;
                padding: 20px 50px;
                min-width: 220px;
            }
        }


        .button-image:active,
        .action-button:active {
            transform: scale(0.98);
            transition: transform 0.1s;
        }


        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .button-container {
            animation: float 6s ease-in-out infinite;
        }

        .button-container:nth-child(2) {
            animation-delay: 2s;
        }

        .button-container:nth-child(3) {
            animation-delay: 4s;
        }
        @media (max-width: 480px) {

    body {
        zoom: 1.15;
    }

    .main-title-arabic {
        font-size: 3.2rem;
    }

    .main-title-english {
        font-size: 2.2rem;
    }

    .button-image {
        width: 230px;
        height: 230px;
    }

    .button-label {
        font-size: 36px;
        padding: 18px 45px;
    }

    .action-button {
        font-size: 26px;
        padding: 20px 40px;
    }
}
    </style>
</head>

<body>



    <div class="main-title-card">
        <h2 class="main-title">
            <span class="main-title-arabic">حضانه أونلاين</span>
            <span class="main-title-english">Online Kindergarten</span>
        </h2>
    </div>

    <div class="button-group">

        <div class="button-container arabic">
            <div class="button-wrapper">
                <div class="button-image" onclick="window.location.href='Arpic.html'">
                    <img src="الحروف.jpeg" alt="تعلم اللغة العربية">
                </div>
            </div>
            <div class="button-label">عربي</div>
        </div>


        <div class="button-container math">
            <div class="button-wrapper">
                <div class="button-image" onclick="window.location.href='math.html'">
                    <img src="123.jpeg" alt="تعلم الرياضيات">
                </div>
            </div>
            <div class="button-label">Math</div>
        </div>


        <div class="button-container english">
            <div class="button-wrapper">
                <div class="button-image" onclick="window.location.href='english.html'">
                    <img src="apc.jpeg" alt="تعلم اللغة الإنجليزية">
                </div>
            </div>
            <div class="button-label">English</div>
        </div>
    </div>
    </div>

    <div class="bottom-buttons">
        <button class="action-button contact" onclick="window.location.href='call.html'">اتصل بنا</button>
        <button class="action-button map" onclick="window.location.href='map.html'">خريطة الحضانة</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // تأثيرات تفاعلية
            const letters = document.querySelectorAll('.welcome-title span');
            letters.forEach((letter, index) => {
                letter.style.animationDelay = `${index * 0.1}s`;
            });


            setTimeout(() => {
                const titleCard = document.querySelector('.main-title-card');
                titleCard.style.transform = 'perspective(1000px) rotateX(0deg) scale(1.05)';
                titleCard.style.boxShadow = '0 30px 60px rgba(0,0,0,0.4)';

                setTimeout(() => {
                    titleCard.style.transform = 'perspective(1000px) rotateX(5deg) scale(1)';
                    titleCard.style.boxShadow = '0 20px 40px rgba(0,0,0,0.2)';
                }, 500);
            }, 800);


            let lastTouchEnd = 0;
            document.addEventListener('touchend', function (event) {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);


            const interactiveElements = document.querySelectorAll('.button-image, .action-button');
            interactiveElements.forEach(element => {
                element.addEventListener('touchstart', function () {
                    this.style.transform = 'scale(0.95)';
                });

                element.addEventListener('touchend', function () {
                    this.style.transform = '';
                });
            });
        });
    </script>
</body>

</html>
